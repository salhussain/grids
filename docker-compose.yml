name: grids

services:
  postgres:
    # Multi-arch PostGIS build (official postgis/postgis is amd64-only)
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['${GRIDS_PG_PORT:-55432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d grids_cell_1']
      interval: 5s
      timeout: 3s
      retries: 20

  objectstore:
    # S3-compatible object storage for dev (code only speaks S3; swap for AWS S3 in prod)
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0
    ports: ['8333:8333']
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mail:
    # Optional SMTP catcher (docker compose --profile mailpit up -d; set SMTP_URL=smtp://localhost:1025).
    # Not needed by default: mail stays in the platform's Email log (SMTP_URL=log).
    profiles: ['mailpit']
    image: axllent/mailpit:v1.27
    environment:
      # Accept any credentials over plain SMTP in dev.
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports: ['1025:1025', '8025:8025']


volumes:
  pgdata:
  s3data:
