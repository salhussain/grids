<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grids Dashboards Mockup</title>
<meta name="description" content="Three redesign directions for the platform's dashboards module: list, view, edit, widget editor and settings." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
  :root {
    --brand: #0f62fe; --brand-soft: color-mix(in oklab, var(--brand) 9%, white); --brand-line: color-mix(in oklab, var(--brand) 28%, white); --brand-ink: color-mix(in oklab, var(--brand) 78%, black);
    --canvas: #efeff1; --sheet: #fff; --raise: #fafafb; --ink: #121316; --ink-2: #4a4c55; --ink-3: #82848d; --line: #e4e4e8; --line-2: #d3d4da; --hover: #f3f3f5;
    --shadow: 0 1px 2px rgb(16 18 24 / .05), 0 8px 28px -14px rgb(16 18 24 / .16);
    --good: #198038; --good-soft: #e8f5ec; --warn: #9a7400; --warn-soft: #fcf4d6; --warn-line: #ecd98a; --bad: #da1e28; --bad-soft: #fdecec;
    --c1: #6929c4; --c2: #1192e8; --c3: #005d5d; --c4: #9f1853;
    --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { color-scheme: dark; --brand-soft: color-mix(in oklab, var(--brand) 18%, #17181b); --brand-line: color-mix(in oklab, var(--brand) 45%, #17181b); --brand-ink: color-mix(in oklab, var(--brand) 55%, white); --canvas: #0d0e10; --sheet: #17181b; --raise: #1c1d21; --ink: #f1f1f3; --ink-2: #b4b6bf; --ink-3: #7c7e88; --line: #26272c; --line-2: #34363c; --hover: #202126; --good: #42be65; --good-soft: #10261a; --warn: #f1c21b; --warn-soft: #2a2410; --warn-line: #5a4c16; --bad: #ff6b72; --bad-soft: #2d1416; } }
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; } button { cursor: pointer; } h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; } .eyebrow { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); } .muted { color: var(--ink-3); } .sub { color: var(--ink-2); }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .row { display: flex; align-items: center; gap: 10px; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; } .end { margin-left: auto; } .gap { display: grid; gap: 16px; }

  .switch { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 4px; padding: 10px 16px; background: var(--ink); color: #fff; flex-wrap: wrap; }
  .switch b { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-right: 10px; opacity: .6; } .switch button { background: transparent; border: 1px solid #ffffff30; color: #fff; padding: 5px 12px; } .switch button[aria-pressed='true'] { background: #fff; color: #121316; border-color: #fff; }
  .screens { display: flex; gap: 2px; max-width: 1360px; margin: 12px auto 0; padding: 0 16px; flex-wrap: wrap; } .screens button { background: var(--sheet); border: 1px solid var(--line); padding: 6px 14px; color: var(--ink-2); } .screens button[aria-pressed='true'] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .note { max-width: 1360px; margin: 10px auto 0; padding: 0 16px; font-size: 13px; color: var(--ink-2); } .note b { color: var(--ink); }
  .stage { max-width: 1360px; margin: 12px auto 48px; padding: 0 16px; }
  .sheet { background: var(--sheet); border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 640px; position: relative; }
  .pad { padding: 22px 26px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-2); background: var(--sheet); white-space: nowrap; } .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; } .btn.primary:hover { background: var(--brand-ink); } .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); } .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; } .btn.icon { width: 32px; padding: 0; justify-content: center; } .btn.danger { color: var(--bad); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid var(--line); background: var(--raise); font-size: 12px; white-space: nowrap; } .chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; } .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); } .chip.info { background: var(--brand-soft); color: var(--brand-ink); border-color: transparent; }
  .field { display: grid; gap: 4px; } .field > label { font-size: 12px; font-weight: 500; color: var(--ink-2); } .field input, .field select, .field textarea { min-height: 34px; border: 1px solid var(--line-2); background: var(--sheet); padding: 0 10px; } .field textarea { padding: 8px 10px; resize: vertical; } .field small { color: var(--ink-3); font-size: 12px; }
  .card { background: var(--sheet); border: 1px solid var(--line); } .card > header { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); } .card > header h3 { font-size: 14px; font-weight: 600; } .card .body { padding: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; } th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--raise); } td { padding: 10px 14px; border-bottom: 1px solid var(--line); } tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); } td.num, th.num { text-align: right; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; } .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; color: var(--ink-3); margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; } .tabs button[aria-selected='true'] { color: var(--ink); border-bottom-color: var(--brand); }
  .seg { display: inline-flex; border: 1px solid var(--line-2); } .seg button { border: 0; background: var(--sheet); padding: 4px 11px; color: var(--ink-2); } .seg button[aria-pressed='true'] { background: var(--ink); color: var(--sheet); }
  .toggle { width: 34px; height: 18px; background: var(--line-2); position: relative; border: 0; padding: 0; flex: none; } .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; transition: transform .15s; } .toggle[aria-checked='true'] { background: var(--brand); } .toggle[aria-checked='true']::after { transform: translateX(16px); }
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .5); display: grid; place-items: center; padding: 16px; z-index: 40; } .modal { background: var(--sheet); width: min(860px, 100%); max-height: 92vh; overflow: auto; box-shadow: var(--shadow); border-top: 3px solid var(--brand); }
  .modal > header { display: flex; align-items: center; gap: 10px; padding: 16px 22px; border-bottom: 1px solid var(--line); } .modal > footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--raise); }

  /* dashboard canvas */
  .canvas { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; } .w { background: var(--sheet); border: 1px solid var(--line-2); position: relative; display: flex; flex-direction: column; min-width: 0; }
  .w > .t { padding: 10px 14px 0; font-size: 13px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 6px; } .w > .b { padding: 8px 14px 12px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; }
  .w .big { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; } .w .delta { font-size: 12px; display: inline-flex; gap: 4px; align-items: center; padding: 1px 6px; margin-top: 6px; width: fit-content; } .delta.good { background: var(--good-soft); color: var(--good); } .delta.bad { background: var(--bad-soft); color: var(--bad); }
  .edit .w { border-style: dashed; cursor: grab; } .edit .w:hover { border-color: var(--brand); } .w.sel { border: 2px solid var(--brand); border-style: solid; box-shadow: 0 0 0 3px var(--brand-soft); }
  .w .tools { position: absolute; top: 6px; right: 6px; display: none; gap: 2px; background: var(--sheet); border: 1px solid var(--line); } .edit .w:hover .tools, .w.sel .tools { display: flex; } .tools button { border: 0; background: none; width: 24px; height: 24px; display: grid; place-items: center; color: var(--ink-2); } .tools button:hover { background: var(--hover); }
  .w .resize { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; cursor: nwse-resize; display: none; background: linear-gradient(135deg, transparent 50%, var(--brand) 50%); } .edit .w:hover .resize, .w.sel .resize { display: block; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .fchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line-2); background: var(--sheet); } .fchip b { font-weight: 500; } .fchip.on { border-color: var(--brand); background: var(--brand-soft); }
  .insp { width: 320px; flex: none; border-left: 1px solid var(--line); background: var(--sheet); display: flex; flex-direction: column; } .insp .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; } .insp h4 { margin: 0; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .palette { width: 200px; flex: none; border-right: 1px solid var(--line); background: var(--raise); padding: 12px; display: grid; gap: 6px; align-content: start; } .pal { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--sheet); border: 1px solid var(--line); text-align: left; } .pal:hover { border-color: var(--brand); } .pal svg { color: var(--brand); }
  .thumb { height: 92px; background: var(--raise); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px; } .thumb i { background: var(--line-2); display: block; } .thumb i.k { height: 22px; } .thumb i.wide { grid-column: span 3; height: 100%; background: linear-gradient(to top, var(--brand-soft), transparent); border-top: 2px solid var(--brand-line); } .thumb i.sq { background: var(--brand-soft); }
  .dcard { background: var(--sheet); border: 1px solid var(--line); cursor: pointer; } .dcard:hover { border-color: var(--ink-3); } .dcard .meta { padding: 12px 14px; display: grid; gap: 4px; }
  .opt { display: none; } .opt.on { display: block; }
  .flex { display: flex; } .stretch { align-items: stretch; }
  .drawer { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet); border-top: 3px solid var(--brand); box-shadow: 0 -12px 30px -14px rgb(0 0 0 / .3); z-index: 5; }
  @media (max-width: 1000px) { .insp, .palette { display: none; } .canvas { grid-template-columns: 1fr; } .canvas > * { grid-column: 1 / -1 !important; } }
</style>
</head>
<body>

<div class="switch" role="toolbar" aria-label="Design option">
  <b>Dashboards redesign</b>
  <button data-opt="A" aria-pressed="true">A · Canvas + inspector</button>
  <button data-opt="B" aria-pressed="false">B · Palette + drawer</button>
  <button data-opt="C" aria-pressed="false">C · Focused + settings page</button>
</div>
<div class="screens" id="screens" role="toolbar" aria-label="Screen"></div>
<p class="note" id="note"></p>
<div class="stage"><div class="sheet" id="sheet"></div></div>
<div id="layer"></div>

<script>
  const I = {
    plus: '<svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>', back: '<svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>', edit: '<svg viewBox="0 0 16 16"><path d="M2.5 13.5 3 10l7.5-7.5 3 3L6 13z"/></svg>', trash: '<svg viewBox="0 0 16 16"><path d="M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.6 9h5.8l.6-9"/></svg>',
    gear: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg>', filter: '<svg viewBox="0 0 16 16"><path d="M2 4h12M4 8h8M6.5 12h3"/></svg>', star: '<svg viewBox="0 0 16 16"><path d="m8 1.8 1.9 3.9 4.2.6-3 3 .7 4.2L8 11.5l-3.8 2 .7-4.2-3-3 4.2-.6z"/></svg>',
    eye: '<svg viewBox="0 0 16 16"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>', up: '<svg viewBox="0 0 16 16"><path d="M8 13V3m-3.5 3.5L8 3l3.5 3.5"/></svg>', down: '<svg viewBox="0 0 16 16"><path d="M8 3v10m-3.5-3.5L8 13l3.5-3.5"/></svg>', drag: '<svg viewBox="0 0 16 16"><path d="M6 3.5v.01M10 3.5v.01M6 8v.01M10 8v.01M6 12.5v.01M10 12.5v.01"/></svg>',
    kpi: '<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10"/><path d="M5 10l2-2.5 2 1.5 2-3"/></svg>', line: '<svg viewBox="0 0 16 16"><path d="M2 12l3.5-4 3 2.5L14 4"/></svg>', bar: '<svg viewBox="0 0 16 16"><path d="M3 13V8M7 13V4M11 13V6M14.5 13.5h-13"/></svg>', pie: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2v6l5 2"/></svg>', gauge: '<svg viewBox="0 0 16 16"><path d="M2.5 11a5.5 5.5 0 1 1 11 0M8 11l2.5-3.5"/></svg>', table: '<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12M6 3v10"/></svg>', map: '<svg viewBox="0 0 16 16"><path d="M2 4l4-1.5 4 1.5 4-1.5v9.5L10 13.5 6 12 2 13.5z"/></svg>', text: '<svg viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6"/></svg>',
    lock: '<svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>', globe: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12"/></svg>', x: '<svg viewBox="0 0 16 16"><path d="m3.5 3.5 9 9m0-9-9 9"/></svg>', copy: '<svg viewBox="0 0 16 16"><rect x="5" y="5" width="8" height="8"/><path d="M3 11V3h8"/></svg>', search: '<svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>', grid: '<svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>', list: '<svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/></svg>', refresh: '<svg viewBox="0 0 16 16"><path d="M13 5A5.5 5.5 0 0 0 3 6M3 3v3h3M3 11a5.5 5.5 0 0 0 10 1M13 13v-3h-3"/></svg>', clock: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>', db: '<svg viewBox="0 0 16 16"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/></svg>',
  };
  const WIDGETS = [
    { id: 'w1', t: 'kpi', title: 'Beds occupied (latest)', w: 3, h: 1, big: '1,170' },
    { id: 'w2', t: 'gauge', title: 'Bed occupancy', w: 3, h: 1, big: '1,170', unit: 'beds' },
    { id: 'w3', t: 'kpi', title: 'Facilities reporting', w: 3, h: 1, big: '24' },
    { id: 'w4', t: 'kpi', title: 'Stock-out days (28 days)', w: 3, h: 1, big: '76', delta: '−11 (−13%) vs previous', good: true },
    { id: 'w5', t: 'area', title: 'Beds occupied each week', w: 8, h: 2 },
    { id: 'w6', t: 'pie', title: 'Beds in use by kind of facility', w: 4, h: 2 },
  ];
  const DASH = [
    ['Health overview', 'Cases, visits and vaccinations across every facility.', 9, 3, 'Members', '6 days ago', 'Salman Raza', true],
    ['Disease watch', 'Where malaria and dengue are rising or falling.', 7, 2, 'Members', '6 days ago', 'Salman Raza', true],
    ['Capacity and supplies', 'Beds in use and medicines running out, by facility.', 8, 3, 'Public', '6 days ago', 'Kofi Mensah', false],
    ['Clinic reports', 'Filters come from the dataset’s parameters.', 7, 1, 'Members', '3 days ago', 'Amara Okafor', false],
    ['DDD', 'DDDDD', 0, 0, 'Members', '23 hours ago', 'Salman Raza', false],
  ];
  const ROW = 118;
  const ch = {
    area: '<svg viewBox="0 0 400 130" preserveAspectRatio="none" style="width:100%;height:100%;min-height:90px"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".28"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs><path d="M0 50 C30 62 60 46 90 56 S150 34 190 40 S250 66 290 58 S350 48 400 54 V130 H0Z" fill="url(#g)" stroke="none"/><path d="M0 50 C30 62 60 46 90 56 S150 34 190 40 S250 66 290 58 S350 48 400 54" stroke="var(--brand)" stroke-width="2"/><g stroke="var(--line)" stroke-dasharray="3 4"><path d="M0 30h400M0 70h400M0 110h400"/></g></svg>',
    pie: '<div style="display:flex;align-items:center;gap:16px;justify-content:center;height:100%"><svg viewBox="0 0 42 42" style="width:130px;height:130px"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--c1)" stroke-width="6" stroke-dasharray="45 55" transform="rotate(-90 21 21)"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--c2)" stroke-width="6" stroke-dasharray="40 60" stroke-dashoffset="-45" transform="rotate(-90 21 21)"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--c3)" stroke-width="6" stroke-dasharray="15 85" stroke-dashoffset="-85" transform="rotate(-90 21 21)"/></svg><div style="display:grid;gap:6px;font-size:12px"><span><i style="display:inline-block;width:9px;height:9px;background:var(--c1);margin-right:6px"></i>Clinic</span><span><i style="display:inline-block;width:9px;height:9px;background:var(--c2);margin-right:6px"></i>Hospital</span><span><i style="display:inline-block;width:9px;height:9px;background:var(--c3);margin-right:6px"></i>Health centre</span></div></div>',
    gauge: '<svg viewBox="0 0 100 56" style="width:150px;height:84px;margin:auto"><path d="M10 50a40 40 0 0 1 80 0" fill="none" stroke="var(--line)" stroke-width="9"/><path d="M10 50a40 40 0 0 1 60 -34.6" fill="none" stroke="#198038" stroke-width="9"/><path d="M70 15.4a40 40 0 0 1 14 12" fill="none" stroke="#e8b710" stroke-width="9"/><path d="M84 27.4a40 40 0 0 1 6 22.6" fill="none" stroke="#da1e28" stroke-width="9"/><path d="M50 50 38 28" stroke="var(--ink)" stroke-width="3"/></svg>',
  };
  const wBody = (w) => w.t === 'kpi' ? `<div class="big">${w.big}</div>${w.delta ? `<span class="delta ${w.good ? 'good' : 'bad'}">${w.delta}</span>` : ''}` : w.t === 'gauge' ? `${ch.gauge}<div class="big" style="font-size:24px;text-align:center">${w.big} <span class="muted" style="font-size:14px;font-weight:400">${w.unit}</span></div>` : ch[w.t] || '';
  const widget = (w, o = {}) => `<div class="w ${o.sel === w.id ? 'sel' : ''}" data-w="${w.id}" style="grid-column: span ${w.w}; min-height:${w.h * ROW}px"><div class="t">${o.edit ? `<span class="muted">${I.drag}</span>` : ''}<span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${w.title}</span></div><div class="b">${wBody(w)}</div>${o.edit ? `<div class="tools"><button title="Move up">${I.up}</button><button title="Move down">${I.down}</button><button title="Duplicate">${I.copy}</button><button title="Delete">${I.trash}</button></div><i class="resize"></i>` : ''}</div>`;
  const filterBar = (extra = '') => `<div class="filters"><span class="fchip">${I.globe}<b>Country</b> All countries</span><span class="fchip">${I.clock}<b>Period</b> Last 12 weeks</span><span class="fchip on">${I.filter}<b>Facility type</b> Clinic, Hospital ×</span><button class="btn sm ghost">${I.plus} Filter</button>${extra}</div>`;

  /* ------------ shared list ------------ */

  const listHead = (title, sub) => `<div class="row wrap"><div class="grow"><div class="eyebrow">Project · Caribbean Health Network</div><h1 style="font-size:24px;font-weight:600;letter-spacing:-.01em">${title}</h1><p class="sub">${sub}</p></div><button class="btn primary" data-modal="new">${I.plus} New dashboard</button></div>`;
  const listTools = (toggle) => `<div class="row wrap"><div class="field" style="width:280px"><div class="row" style="border:1px solid var(--line-2);padding:0 10px;height:34px;background:var(--sheet)"><span class="muted">${I.search}</span><input placeholder="Search dashboards" style="border:0;min-height:0;outline:0;padding:0;flex:1;background:transparent"></div></div><button class="btn">${I.filter} Filter</button><div class="seg"><button aria-pressed="true">All</button><button aria-pressed="false">Mine</button><button aria-pressed="false">Starred</button></div>${toggle ? `<div class="seg end"><button aria-pressed="true" title="Cards">${I.grid}</button><button aria-pressed="false" title="Table">${I.list}</button></div>` : ''}</div>`;

    <div class="sec"><h4>Data</h4><div class="field"><label>Dataset</label><select><option>Facility capacity</option><option>Weekly cases</option></select></div><div class="field"><label>Metric</label><select><option>Beds occupied · sum</option></select></div><div class="field"><label>Group by</label><select><option>None</option><option>Kind of facility</option></select></div><div class="row" style="font-size:12px" ><span class="chip info">${I.filter} Reacts to 2 dashboard filters</span></div></div>

  const colFilterCards = () => `<div class="gap" style="gap:10px">${[['Facility type', 'Capacity · kind', 'Pick several', 'All widgets on it'], ['Parish', 'Visits · parish', 'Pick one', '3 of 5 widgets'], ['Beds', 'Capacity · beds', 'Number range', 'All widgets on it']].map((f) => `<div class="row" style="border:1px solid var(--line);padding:10px 12px;background:var(--raise)"><span style="color:var(--brand-ink)">${I.filter}</span><div class="grow"><b style="font-weight:500">${f[0]}</b><div class="muted" style="font-size:12px">${f[1]} · ${f[2]} · ${f[3]}</div></div><button class="btn sm ghost">${I.edit}</button><button class="btn sm ghost danger">${I.trash}</button></div>`).join('')}<button class="btn" style="width:fit-content">${I.plus} Add filter</button></div>`;
  const inspDash = () => `<div class="sec"><h4>General</h4><div class="field"><label>Name</label><input value="Capacity and supplies"></div><div class="field"><label>Description</label><textarea rows="2">Beds in use and medicines running out, by facility.</textarea></div></div>

  /* ------------ OPTION A ------------ */
  const A = {

    edit: (sel = 'w4', tab = 'widget') => `<div class="flex stretch" style="min-height:640px"><div class="grow edit" style="background:var(--canvas)">
      <div class="row wrap" style="background:var(--sheet);border-bottom:1px solid var(--line);padding:10px 16px"><button class="btn ghost" data-screen="view">${I.back}</button><input value="Capacity and supplies" style="border:1px solid transparent;font-size:16px;font-weight:600;min-width:0;width:260px;padding:4px 8px;background:transparent" aria-label="Dashboard name"><span class="chip warn">Unsaved changes</span><span class="end row"><button class="btn">${I.plus} Add widget</button><button class="btn" data-screen="view">${I.eye} Preview</button><button class="btn ghost">Discard</button><button class="btn primary">Save</button></span></div>
      <div style="padding:16px" class="gap">${filterBar('<span class="muted" style="font-size:12px">Filters are set in Dashboard settings →</span>')}<div class="canvas">${WIDGETS.map((w) => widget(w, { edit: true, sel })).join('')}</div></div></div>

    view: () => `<div class="pad gap"><div class="row wrap"><button class="btn ghost" data-screen="list">${I.back} All dashboards</button><div class="grow"><h1 style="font-size:22px;font-weight:600">Capacity and supplies</h1></div><span class="muted" style="font-size:12px">${I.clock} Updated 2 min ago</span><button class="btn icon" title="Refresh">${I.refresh}</button><button class="btn" data-screen="edit">${I.grid} Edit layout</button><button class="btn" data-screen="settings">${I.gear} Settings</button></div>${filterBar()}<div class="canvas">${WIDGETS.map((w) => widget(w)).join('')}</div></div>`,
    edit: () => `<div class="edit"><div class="row wrap" style="background:var(--ink);color:#fff;padding:10px 16px"><span class="chip info" style="background:#ffffff22;color:#fff">Editing layout</span><span class="muted" style="color:#ffffffaa;font-size:13px">Drag to move, corner to resize, hover a widget for its tools</span><span class="end row"><button class="btn" style="background:transparent;color:#fff;border-color:#ffffff44">${I.plus} Add widget</button><button class="btn" style="background:transparent;color:#fff;border-color:#ffffff44" data-screen="view">Cancel</button><button class="btn primary" data-screen="view">Save layout</button></span></div><div class="pad gap" style="background:var(--canvas)"><div class="canvas">${WIDGETS.map((w, i) => widget(w, { edit: true, sel: i === 3 ? 'w4' : '' })).join('')}</div>
      <div class="card" style="width:340px;position:absolute;right:40px;top:190px;box-shadow:var(--shadow)"><header><h3>Stock-out days</h3><button class="btn ghost icon end">${I.x}</button></header><div class="body gap" style="gap:12px"><div class="field"><label>Title</label><input value="Stock-out days (28 days)"></div><div class="field"><label>Metric</label><select><option>Stock-out days · sum</option></select></div><div class="row"><div class="field grow"><label>Width</label><select><option>3 of 12</option></select></div><div class="field grow"><label>Height</label><select><option>1 row</option></select></div></div><button class="btn">More options…</button></div></div></div></div>`,

    settings: (tab = 'general') => `<div class="pad gap"><div class="row"><button class="btn ghost" data-screen="view">${I.back} Capacity and supplies</button></div><div><h1 style="font-size:22px;font-weight:600">Dashboard settings</h1><p class="sub">Everything about the dashboard except its widgets.</p></div><div class="flex" style="gap:24px;align-items:flex-start"><nav style="width:190px;display:grid;gap:2px;flex:none">${[['general', 'General', I.list], ['filters', 'Filters', I.filter], ['access', 'Access & sharing', I.lock], ['embed', 'Embed', I.copy], ['history', 'History', I.clock]].map((t) => `<button class="btn ghost" style="justify-content:flex-start;height:34px;${tab === t[0] ? 'background:var(--brand-soft);color:var(--ink);border-left:2px solid var(--brand);font-weight:500' : ''}" data-stab="${t[0]}">${t[2]} ${t[1]}</button>`).join('')}</nav><div class="grow gap">${{
      general: `<div class="card"><header><h3>General</h3></header><div class="body gap"><div class="field"><label>Name</label><input value="Capacity and supplies"></div><div class="field"><label>Description</label><textarea rows="2">Beds in use and medicines running out, by facility.</textarea></div><div class="field"><label>Icon</label><select><option>Activity</option></select></div></div></div><div class="card" style="border-color:color-mix(in oklab,var(--bad) 35%,var(--line))"><header><h3 style="color:var(--bad)">Delete dashboard</h3></header><div class="body row"><span class="sub grow" style="font-size:13px">Deletes the dashboard and its 8 widgets. Datasets and data elements are not affected.</span><button class="btn danger">${I.trash} Delete…</button></div></div>`,
      filters: `<div class="card"><header><h3>Header filters</h3></header><div class="body gap">${toggleRow('Period', 'Viewers choose the time window of charts and KPIs')}<div class="field"><label>Area</label><select><option>Country</option></select><small>Viewers pick one; every widget shows only its subtree</small></div></div></div><div class="card"><header><h3>Column filters</h3><span class="muted" style="font-size:12px">Viewers filter widgets by a column of a dataset</span><button class="btn sm end">${I.plus} Add filter</button></header><div class="body">${colFilterCards()}</div></div>`,
      access: `<div class="card"><header><h3>Access</h3></header><div class="body gap"><div class="field"><label>Who can see it</label><select><option>Everyone in the project</option></select><small>Members see it if it needs their level of the permission hierarchy or any level below. Managers see everything.</small></div>${toggleRow('Public link', 'Anyone with the link can view, without signing in', true)}<div class="row"><div class="field grow"><label>Link</label><input value="https://example.org/public/bes/caribbean-health/capacity" readonly class="mono"></div><button class="btn" style="margin-top:18px">${I.copy} Copy</button></div></div></div>`,
      embed: `<div class="card"><header><h3>Embed</h3></header><div class="body gap"><p class="sub" style="font-size:13px">Put this dashboard in another site. It follows the public link’s access.</p><div class="field"><label>Code</label><textarea rows="3" class="mono">&lt;iframe src="https://example.org/embed/bes/capacity" width="100%" height="700"&gt;&lt;/iframe&gt;</textarea></div></div></div>`,
      history: `<div class="card"><header><h3>History</h3></header><table><tbody>${[['Version 12', 'Salman Raza', 'Today, 09:14', 'Added “Stock-out days” widget'], ['Version 11', 'Kofi Mensah', '6 days ago', 'Changed layout'], ['Version 10', 'Salman Raza', '6 days ago', 'Added Facility type filter']].map((v) => `<tr><td><b>${v[0]}</b></td><td class="muted">${v[1]}</td><td class="muted">${v[2]}</td><td>${v[3]}</td><td class="num"><button class="btn sm">Restore</button></td></tr>`).join('')}</tbody></table></div>`,
    }[tab]}</div></div></div>`,
  };

  /* ------------ wiring ------------ */
  const SCREENS = [['list', 'List'], ['view', 'View'], ['edit', 'Edit mode'], ['widget', 'Widget editor'], ['settings', 'Settings & filters']];
  const NOTES = {
    A: '<b>A · Canvas + inspector.</b> Edit mode keeps the dashboard in view: a slim toolbar, the canvas with drag handles, and a right-hand inspector with Widget and Dashboard tabs. The widget editor and the settings are not pop-ups, so you see the change as you make it.',
    B: '<b>B · Palette + drawer.</b> Build by adding: a left palette of widget types, a drawer that rises from the bottom to configure the selected widget next to a live preview, and settings in a pop-up. Viewers get filters down the left side instead of across the top.',
    C: '<b>C · Focused + settings page.</b> Viewing stays clean. “Edit layout” is only about position and size, with a floating card for quick widget changes. Everything else (filters, access, public link, embed, history, delete) lives on its own Settings page with sections.',
  };
  let opt = 'A', screen = 'list', st = { sel: 'w4', tab: 'widget', stab: 'general' };
  const OPTS = { A, B, C };
  const sheet = document.getElementById('sheet');

  const paint = () => {
    document.getElementById('screens').innerHTML = SCREENS.map(([id, l]) => `<button aria-pressed="${id === screen}" data-screen="${id}">${l}</button>`).join('');
    document.getElementById('note').innerHTML = NOTES[opt];
    const o = OPTS[opt];
    let html;
    if (opt === 'A' && screen === 'edit') html = A.edit(st.sel, 'widget');
    else if (opt === 'A' && screen === 'widget') html = A.edit('w5', 'widget');
    else if (opt === 'A' && screen === 'settings') html = A.edit(st.sel, 'dash');
    else if (opt === 'C' && screen === 'settings') html = C.settings(st.stab);
    else html = o[screen]();
    sheet.innerHTML = html;
    if (opt === 'A') sheet.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { screen = b.dataset.tab === 'dash' ? 'settings' : 'edit'; paint(); }));
  };
  const close = () => (layer.innerHTML = '');
  const modal = (inner) => { layer.innerHTML = `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`; layer.querySelector('#scrim').addEventListener('mousedown', (e) => e.target.id === 'scrim' && close()); };
  const head = (t, s = '') => `<header><div class="grow"><h2 style="font-size:17px;font-weight:600">${t}</h2>${s ? `<div class="muted" style="font-size:13px">${s}</div>` : ''}</div><button class="btn ghost icon" data-close>${I.x}</button></header>`;
  const newModal = () => modal(`${head('New dashboard', 'Start blank or from a layout')}<div style="padding:20px 22px" class="gap"><div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="field"><label>Name</label><input placeholder="e.g. Clinic performance"></div><div class="field"><label>Description</label><input placeholder="What it answers"></div></div><div class="eyebrow">Start from</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${[['Blank', 'Add widgets yourself'], ['KPIs + trend', '4 numbers and a chart'], ['Map + table', 'Places and a list'], ['Copy existing', 'Pick a dashboard']].map((t, i) => `<div class="dcard" style="padding:12px;${i === 1 ? 'border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)' : ''}"><div class="thumb" style="height:56px;margin:-12px -12px 8px;border-bottom:1px solid var(--line)"><i class="k"></i><i class="k"></i><i class="wide"></i></div><b>${t[0]}</b><div class="muted" style="font-size:12px">${t[1]}</div></div>`).join('')}</div></div><footer><button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Create dashboard</button></footer>`);
  const settingsModal = () => modal(`${head('Dashboard settings')}<div class="tabs" style="padding:0 22px"><button aria-selected="true">General</button><button aria-selected="false">Filters</button><button aria-selected="false">Access</button></div><div style="padding:18px 22px" class="gap"><div class="field"><label>Name</label><input value="Capacity and supplies"></div><div class="field"><label>Description</label><textarea rows="2">Beds in use and medicines running out, by facility.</textarea></div>${toggleRow('Period filter', 'Viewers choose the time window')}${colFilterCards()}</div><footer><button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Save</button></footer>`);
  document.querySelectorAll('.switch button').forEach((b) => b.addEventListener('click', () => { document.querySelectorAll('.switch button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); opt = b.dataset.opt; paint(); close(); }));
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-open], [data-w]'); if (!t) return;
    if (t.matches('[data-close]')) return close();
    if (t.dataset.screen) { screen = t.dataset.screen; return paint(), window.scrollTo(0, 0); }
    if (t.dataset.modal === 'new') return newModal();
    if (t.dataset.modal === 'settings') return settingsModal();
    if (t.dataset.open !== undefined) { screen = 'view'; return paint(); }
    if (t.dataset.stab) { st.stab = t.dataset.stab; return paint(); }
    if (t.dataset.add) { const c = document.getElementById('bcanvas'); if (c) c.insertAdjacentHTML('beforeend', widget({ id: 'n' + Date.now(), t: 'kpi', title: 'New ' + t.dataset.add.toLowerCase() + ' widget', w: 4, h: 1, big: '—' }, { edit: true })); return; }
    if (t.dataset.w && screen === 'edit' && opt === 'A') { st.sel = t.dataset.w; return paint(); }
    if (t.dataset.w && screen === 'edit' && opt === 'B') { screen = 'widget'; return paint(); }
    const seg = t.closest('.seg'); if (seg) seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === t)));
    if (t.classList.contains('toggle')) t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true'));
  });
  document.addEventListener('keydown', (e) => e.key === 'Escape' && close());
  paint();
</script>
</body>
</html>
