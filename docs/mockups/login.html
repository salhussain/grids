<title>Grids Sign-in Mockup</title>
<meta name="description" content="Clickable mockup of the Grids sign-in page: states, tenant branding, light and dark." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
  /* Layout: split screen. Dark brand panel (44%, max 640px) beside a centred 400px form column.
     Tokens mirror packages/ui/src/theme.css: sharp (radius 0), IBM Plex, brand-derived accent steps. */
  :root {
    --brand-600: #0f62fe;
    --brand-contrast: #ffffff;
    --brand-50: color-mix(in oklab, var(--brand-600) 8%, white);
    --brand-500: color-mix(in oklab, var(--brand-600) 82%, white);
    --brand-700: color-mix(in oklab, var(--brand-600) 80%, black);
    --brand-800: color-mix(in oklab, var(--brand-600) 62%, black);

    --ink: #161616;
    --canvas: #f4f4f4;
    --snow: #ffffff;
    --chrome: #161616;
    --line: #d4d4d8;
    --line-soft: #e4e4e7;
    --muted: #71717a;
    --soft: #52525b;
    --label: #3f3f46;
    --red-50: #fef2f2;
    --red-600: #dc2626;
    --red-800: #991b1b;
    --amber-700: #b45309;
    --green-50: #ecfdf5;
    --green-600: #059669;
    --green-800: #065f46;

    --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;
      --ink: #f2f2f3; --canvas: #111214; --snow: #1a1b1e; --chrome: #0a0a0b;
      --line: #43444a; --line-soft: #323338; --muted: #9b9ca4; --soft: #b5b6bd; --label: #cecfd5;
      --red-50: #2c1517; --red-600: #e5484d; --red-800: #ffabae; --amber-700: #ffc95e;
      --green-50: #10251c; --green-600: #2fb47a; --green-800: #8eebc0;
      --brand-50: color-mix(in oklab, var(--brand-600) 14%, #1a1b1e);
      --brand-500: color-mix(in oklab, var(--brand-600) 80%, white);
      --brand-700: color-mix(in oklab, var(--brand-600) 62%, white);
      --brand-800: color-mix(in oklab, var(--brand-600) 42%, white);
    }
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --ink: #f2f2f3; --canvas: #111214; --snow: #1a1b1e; --chrome: #0a0a0b;
    --line: #43444a; --line-soft: #323338; --muted: #9b9ca4; --soft: #b5b6bd; --label: #cecfd5;
    --red-50: #2c1517; --red-600: #e5484d; --red-800: #ffabae; --amber-700: #ffc95e;
    --green-50: #10251c; --green-600: #2fb47a; --green-800: #8eebc0;
    --brand-50: color-mix(in oklab, var(--brand-600) 14%, #1a1b1e);
    --brand-500: color-mix(in oklab, var(--brand-600) 80%, white);
    --brand-700: color-mix(in oklab, var(--brand-600) 62%, white);
    --brand-800: color-mix(in oklab, var(--brand-600) 42%, white);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand-600); outline-offset: 2px; }

  /* Mockup controls (not part of the design) */
  .mock-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 16px; background: var(--snow); border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
  .mock-bar b { font-family: var(--font-mono); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; color: var(--soft); }
  .mock-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--line); background: var(--snow); }
  .seg button { border: 0; background: none; padding: 5px 10px; cursor: pointer; color: var(--soft); font-size: 12px; }
  .seg button[aria-pressed='true'] { background: var(--ink); color: var(--canvas); }
  .swatch { width: 22px; height: 22px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
  .swatch[aria-pressed='true'] { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Frame */
  .frame { display: flex; min-height: calc(100% - 46px); }
  .brand { position: relative; display: none; overflow: hidden; background: var(--chrome); color: #fff; }
  @media (min-width: 1024px) { .brand { display: flex; flex-direction: column; width: 44%; max-width: 640px; } }
  .brand canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .brand::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--chrome), color-mix(in srgb, var(--chrome) 80%, transparent), color-mix(in srgb, var(--chrome) 30%, transparent)); }
  .brand-inner { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; padding: 56px; }
  .org { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
  .brand h2 { margin: 0; font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; max-width: 28rem; }
  .points { list-style: none; margin: 32px 0 0; padding: 0; display: grid; gap: 16px; max-width: 28rem; }
  .points li { display: flex; gap: 12px; align-items: flex-start; color: #d4d4d8; }
  .points .ic { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid rgb(255 255 255 / .15); background: rgb(255 255 255 / .05); color: var(--brand-500); }
  .points span:last-child { padding-top: 4px; }
  .powered { margin-top: 48px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #71717a; }

  .mark rect { fill: var(--brand-600); }
  .mark path { fill: var(--brand-contrast); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--snow); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; }
  .top .org { font-size: 15px; gap: 10px; }
  @media (min-width: 1024px) { .top .org { visibility: hidden; } }
  .tools { display: flex; gap: 8px; }
  .lang { height: 36px; border: 1px solid var(--line); background: var(--snow); padding: 0 12px; font-size: 14px; border-radius: 0; }
  .modes { display: flex; border: 1px solid var(--line); background: var(--snow); }
  .modes button { width: 34px; height: 34px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .modes button[aria-checked='true'] { background: var(--ink); color: var(--canvas); }

  .stage { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 24px 20px 48px; }
  @media (min-width: 640px) { .stage { align-items: center; padding: 0 32px; } .top, .foot { padding-inline: 32px; } }
  .card { width: 100%; max-width: 400px; }

  .step-icon { width: 44px; height: 44px; display: grid; place-items: center; margin-bottom: 20px; background: var(--brand-50); color: var(--brand-700); }
  h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
  .sub { margin: 8px 0 28px; color: var(--soft); }
  .stack { display: grid; gap: 20px; }

  label.lbl { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--label); }
  .field { position: relative; }
  .input { width: 100%; height: 44px; border: 1px solid var(--line); background: var(--snow); padding: 0 12px; font-size: 15px; border-radius: 0; transition: border-color .15s; }
  .input:hover { border-color: var(--muted); }
  .input:focus { outline: 2px solid var(--brand-600); outline-offset: -2px; border-color: var(--brand-600); }
  .input[aria-invalid='true'] { border-color: var(--red-600); }
  .input.pw { padding-right: 44px; }
  .eye { position: absolute; right: 0; top: 0; width: 44px; height: 44px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .eye:hover { color: var(--ink); }
  .note { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .note.warn { color: var(--amber-700); }
  .code { height: 56px; text-align: center; font-family: var(--font-mono); font-size: 24px; letter-spacing: .5em; padding-left: .5em; font-variant-numeric: tabular-nums; }

  .row-end { display: flex; justify-content: flex-end; margin-top: 8px; }
  .link { border: 0; background: none; padding: 0; color: var(--brand-700); font-size: 14px; font-weight: 500; cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--label); cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--brand-600); margin: 0; }

  .submit { display: inline-flex; width: 100%; height: 44px; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--brand-600); color: var(--brand-contrast); font-size: 15px; font-weight: 500; cursor: pointer; transition: background .15s; }
  .submit:hover { background: var(--brand-700); }
  .submit:disabled { opacity: .6; cursor: not-allowed; }
  .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner { display: flex; gap: 10px; padding: 12px 14px; font-size: 14px; border-left: 4px solid; }
  .banner svg { flex: none; margin-top: 2px; }
  .banner.err { border-color: var(--red-600); background: var(--red-50); color: var(--red-800); }
  .banner.ok { border-color: var(--green-600); background: var(--green-50); color: var(--green-800); }

  .divider { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line-soft); font-size: 14px; color: var(--soft); }
  .back { display: inline-flex; align-items: center; gap: 6px; margin-top: 24px; }

  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 16px 20px; font-size: 12px; color: var(--muted); }
  .foot nav { display: flex; gap: 16px; }
  .foot a { color: inherit; text-decoration: none; }
  .foot a:hover { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }
</style>

<div class="mock-bar" role="toolbar" aria-label="Mockup controls">
  <div class="mock-group"><b>State</b>
    <div class="seg" id="state-seg">
      <button type="button" data-state="signIn" aria-pressed="true">Sign in</button>
      <button type="button" data-state="error" aria-pressed="false">Wrong password</button>
      <button type="button" data-state="mfa" aria-pressed="false">Two-step</button>
      <button type="button" data-state="forgot" aria-pressed="false">Forgot</button>
      <button type="button" data-state="sent" aria-pressed="false">Link sent</button>
    </div>
  </div>
  <div class="mock-group"><b>Tenant</b>
    <button type="button" class="swatch" data-org="grids" style="background:#0f62fe" title="Grids (no tenant)" aria-label="Grids, no tenant branding" aria-pressed="true"></button>
    <button type="button" class="swatch" data-org="river" style="background:#00796b" title="Riverbend Water Authority" aria-label="Riverbend Water Authority" aria-pressed="false"></button>
    <button type="button" class="swatch" data-org="health" style="background:#b4235a" title="Kestrel District Health" aria-label="Kestrel District Health" aria-pressed="false"></button>
  </div>
</div>

<div class="frame">
  <aside class="brand" aria-hidden="false">
    <canvas id="grid-art" aria-hidden="true"></canvas>
    <div class="brand-inner">
      <div class="org"><span class="mark-slot"></span><span class="org-name">Grids</span></div>
      <div style="margin-top:auto">
        <h2 id="headline">One platform for your data</h2>
        <ul class="points">
          <li><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="8" y="2" width="8" height="4"/><path d="M16 4h3v18H5V4h3M9 12h6M9 16h6"/></svg></span><span>Collect data in the field, online or offline</span></li>
          <li><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3" y="3" width="8" height="8"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect x="13" y="13" width="8" height="8"/></svg></span><span>Automate ingestion, processing and alerts</span></li>
          <li><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 3v18h18M8 17v-5M13 17V7M18 17v-8"/></svg></span><span>Maps, dashboards and KPIs your teams trust</span></li>
        </ul>
      </div>
      <div class="powered" id="powered" hidden><span class="mark-slot small"></span>Powered by Grids</div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="org"><span class="mark-slot"></span><span class="org-name">Grids</span></div>
      <div class="tools">
        <select class="lang" id="lang" aria-label="Language">
          <option>English</option><option>Español</option><option>العربية</option>
        </select>
        <div class="modes" role="radiogroup" aria-label="Appearance">
          <button type="button" role="radio" data-mode="light" aria-checked="false" aria-label="Light" title="Light"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button type="button" role="radio" data-mode="dark" aria-checked="false" aria-label="Dark" title="Dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
          <button type="button" role="radio" data-mode="system" aria-checked="true" aria-label="System" title="System"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14"/><path d="M8 21h8M12 17v4"/></svg></button>
        </div>
      </div>
    </header>

    <main class="stage"><div class="card" id="card"></div></main>

    <footer class="foot">
      <span id="copyright">© 2026 Grids</span>
      <nav><a href="#">Privacy</a><a href="#">Terms</a></nav>
    </footer>
  </div>
</div>

<script>
  const ORGS = {
    grids: { name: 'Grids', color: '#0f62fe', headline: 'One platform for your data', tenant: false, register: false },
    river: { name: 'Riverbend Water', color: '#00796b', headline: 'Meter reads, pump stations and water quality in one place', tenant: true, register: false },
    health: { name: 'Kestrel Health', color: '#b4235a', headline: 'Clinic reporting for the Kestrel district', tenant: true, register: true },
  };
  const markSvg = (size) =>
    `<svg class="mark" width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32"/><path d="M9 9h6v6H9zM17 9h6v6h-6zM9 17h6v6H9zM17 17h6v6h-6z"/></svg>`;
  const ICON = {
    alert: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
    eye: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.4 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/></svg>',
    shield: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
    mail: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16"/><path d="m2 6 10 7 10-7"/></svg>',
    back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  };

  let org = 'grids';
  let state = 'signIn';
  const form = { email: 'amina.rahman@riverbend.example', password: '', remember: true };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  function signIn(error) {
    const o = ORGS[org];
    return `
      <form id="f" novalidate>
        <h1>Sign in</h1>
        <p class="sub">to continue to ${esc(o.name)}</p>
        <div class="stack">
          ${error ? `<div class="banner err" role="alert">${ICON.alert}<span>Incorrect email or password.</span></div>` : ''}
          <div>
            <label class="lbl" for="email">Email</label>
            <input class="input" id="email" type="email" autocomplete="username" value="${esc(form.email)}" ${error ? 'aria-invalid="true"' : ''} />
          </div>
          <div>
            <label class="lbl" for="password">Password</label>
            <div class="field">
              <input class="input pw" id="password" type="password" autocomplete="current-password" value="${esc(form.password)}" ${error ? 'aria-invalid="true"' : ''} />
              <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">${ICON.eye}</button>
            </div>
            <div class="note warn" id="caps" hidden>Caps Lock is on</div>
            <div class="row-end"><button type="button" class="link" data-go="forgot">Forgot password?</button></div>
          </div>
          <label class="check"><input type="checkbox" id="remember" ${form.remember ? 'checked' : ''} /> Keep me signed in</label>
          <button class="submit" id="submit" type="submit">Sign in</button>
        </div>
        ${o.register ? `<p class="divider">New to ${esc(o.name)}? <button type="button" class="link">Create an account</button></p>` : ''}
      </form>`;
  }

  const VIEWS = {
    signIn: () => signIn(false),
    error: () => signIn(true),
    mfa: () => `
      <form id="f" novalidate>
        <div class="step-icon">${ICON.shield}</div>
        <h1>Two-step verification</h1>
        <p class="sub">Enter the 6-digit code from your authenticator app.</p>
        <div class="stack">
          <div>
            <label class="lbl" for="code">Authentication code</label>
            <input class="input code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" dir="ltr" />
          </div>
          <button class="submit" id="submit" type="submit">Verify</button>
          <button type="button" class="link" style="justify-self:start">Use a recovery code instead</button>
        </div>
      </form>`,
    forgot: () => `
      <form id="f" novalidate>
        <div class="step-icon">${ICON.mail}</div>
        <h1>Reset your password</h1>
        <p class="sub">Enter your email address and we’ll send you a link to choose a new password.</p>
        <div class="stack">
          <div>
            <label class="lbl" for="email">Email</label>
            <input class="input" id="email" type="email" value="${esc(form.email)}" />
          </div>
          <button class="submit" id="submit" type="submit">Send reset link</button>
        </div>
        <button type="button" class="link back" data-go="signIn">${ICON.back} Back to sign in</button>
      </form>`,
    sent: () => `
      <div class="step-icon">${ICON.mail}</div>
      <h1>Reset your password</h1>
      <p class="sub"></p>
      <div class="banner ok" role="status">${ICON.check}<span>If an account exists for ${esc(form.email)}, a reset link is on its way. Check your inbox.</span></div>
      <button type="button" class="link back" data-go="signIn">${ICON.back} Back to sign in</button>`,
  };

  const card = document.getElementById('card');

  function render() {
    card.innerHTML = VIEWS[state]();
    document.querySelectorAll('#state-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === state)));
    wire();
  }

  function setState(s) { state = s; render(); }

  function wire() {
    card.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => setState(b.dataset.go)));
    const email = card.querySelector('#email');
    if (email) email.addEventListener('input', (e) => (form.email = e.target.value));
    const pw = card.querySelector('#password');
    if (pw) {
      pw.addEventListener('input', (e) => (form.password = e.target.value));
      const caps = card.querySelector('#caps');
      const onKey = (e) => (caps.hidden = !(e.getModifierState && e.getModifierState('CapsLock')));
      pw.addEventListener('keydown', onKey);
      pw.addEventListener('keyup', onKey);
      const eye = card.querySelector('#eye');
      eye.addEventListener('click', () => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        eye.innerHTML = show ? ICON.eyeOff : ICON.eye;
        eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        eye.setAttribute('aria-pressed', String(show));
      });
    }
    const remember = card.querySelector('#remember');
    if (remember) remember.addEventListener('change', (e) => (form.remember = e.target.checked));
    const code = card.querySelector('#code');
    if (code) code.addEventListener('input', (e) => (e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6)));

    const f = card.querySelector('#f');
    if (f) f.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = card.querySelector('#submit');
      const label = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${label}`;
      setTimeout(() => {
        // Demo flow: blank password → error; otherwise move to the next step.
        if (state === 'signIn' || state === 'error') setState(form.password ? 'mfa' : 'error');
        else if (state === 'forgot') setState('sent');
        else { btn.disabled = false; btn.textContent = label; }
      }, 700);
    });
  }

  function applyOrg(key) {
    org = key;
    const o = ORGS[key];
    document.documentElement.style.setProperty('--brand-600', o.color);
    document.querySelectorAll('.org-name').forEach((n) => (n.textContent = o.name));
    document.querySelectorAll('.mark-slot').forEach((n) => (n.innerHTML = markSvg(n.classList.contains('small') ? 16 : n.closest('.top') ? 28 : 36)));
    document.getElementById('headline').textContent = o.headline;
    document.getElementById('powered').hidden = !o.tenant;
    document.getElementById('copyright').textContent = `© 2026 ${o.tenant ? o.name : 'Grids'}`;
    document.querySelectorAll('.swatch').forEach((s) => s.setAttribute('aria-pressed', String(s.dataset.org === key)));
    render();
    drawGrid();
  }

  // Appearance picker drives data-theme, as the real app does.
  document.querySelectorAll('.modes button').forEach((b) =>
    b.addEventListener('click', () => {
      const m = b.dataset.mode;
      if (m === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', m);
      document.querySelectorAll('.modes button').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
    }),
  );
  document.querySelectorAll('#state-seg button').forEach((b) => b.addEventListener('click', () => setState(b.dataset.state)));
  document.querySelectorAll('.swatch').forEach((s) => s.addEventListener('click', () => applyOrg(s.dataset.org)));

  // Brand panel: faint grid with a slow drift of lit cells in the brand colour (same seeding as Shell.tsx).
  const canvas = document.getElementById('grid-art');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLS = 24, ROWS = 18;
  const cells = Array.from({ length: COLS * ROWS }, (_, i) => i).filter((i) => (i * 7919) % 23 < 2);
  let start = performance.now();
  function drawGrid(now = performance.now()) {
    const r = canvas.getBoundingClientRect();
    if (!r.width) return;
    const dpr = devicePixelRatio || 1;
    if (canvas.width !== Math.round(r.width * dpr)) { canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr); }
    const ctx = canvas.getContext('2d');
    const size = Math.max(r.width / COLS, r.height / ROWS) * dpr;
    const ox = (canvas.width - COLS * size) / 2, oy = (canvas.height - ROWS * size) / 2;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = dpr;
    ctx.beginPath();
    for (let c = 0; c <= COLS; c++) { ctx.moveTo(ox + c * size, oy); ctx.lineTo(ox + c * size, oy + ROWS * size); }
    for (let rr = 0; rr <= ROWS; rr++) { ctx.moveTo(ox, oy + rr * size); ctx.lineTo(ox + COLS * size, oy + rr * size); }
    ctx.stroke();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--brand-600').trim() || '#0f62fe';
    const t = (now - start) / 1000;
    for (const i of cells) {
      const delay = (i * 0.61) % 9;
      const a = reduce ? 0.25 : 0.05 + 0.5 * (0.5 - 0.5 * Math.cos(((t + delay) / 9) * Math.PI * 2));
      ctx.globalAlpha = a;
      ctx.fillRect(ox + (i % COLS) * size + dpr, oy + Math.floor(i / COLS) * size + dpr, size - 2 * dpr, size - 2 * dpr);
    }
    ctx.globalAlpha = 1;
  }
  function loop(now) { drawGrid(now); requestAnimationFrame(loop); }
  addEventListener('resize', () => drawGrid());

  applyOrg('grids');
  if (!reduce) requestAnimationFrame(loop);
</script>
