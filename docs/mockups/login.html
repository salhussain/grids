<title>Grids Sign-in Mockup</title>
<meta name="description" content="Clickable mockup of the Grids sign-in page: states, tenant branding, light and dark." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" />
<style>
  /* Layout: one 400px sign-in card centred on a grey canvas; behind it a full-page grid whose
     cells fade in and out at random in the brand colour. Tokens mirror packages/ui/src/theme.css. */
  :root {
    --brand-600: #0f62fe;
    --brand-contrast: #ffffff;
    --brand-50: color-mix(in oklab, var(--brand-600) 8%, white);
    --brand-700: color-mix(in oklab, var(--brand-600) 80%, black);

    --ink: #161616;
    --canvas: #ececec;
    --snow: #ffffff;
    --gridline: rgb(22 22 22 / 0.06);
    --cell-max: 0.22;
    --line: #d4d4d8;
    --line-soft: #e4e4e7;
    --muted: #71717a;
    --soft: #52525b;
    --label: #3f3f46;
    --hover: #f4f4f5;
    --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 12px 32px -12px rgb(0 0 0 / .18);
    --red-50: #fef2f2; --red-600: #dc2626; --red-800: #991b1b;
    --amber-700: #b45309;
    --green-50: #ecfdf5; --green-600: #059669; --green-800: #065f46;

    --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;
      --ink: #f2f2f3; --canvas: #111214; --snow: #1a1b1e; --gridline: rgb(255 255 255 / 0.05); --cell-max: 0.32;
      --line: #43444a; --line-soft: #323338; --muted: #9b9ca4; --soft: #b5b6bd; --label: #cecfd5; --hover: #26272b;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 16px 40px -12px rgb(0 0 0 / .6);
      --red-50: #2c1517; --red-600: #e5484d; --red-800: #ffabae; --amber-700: #ffc95e;
      --green-50: #10251c; --green-600: #2fb47a; --green-800: #8eebc0;
      --brand-50: color-mix(in oklab, var(--brand-600) 14%, #1a1b1e);
      --brand-700: color-mix(in oklab, var(--brand-600) 62%, white);
    }
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --ink: #f2f2f3; --canvas: #111214; --snow: #1a1b1e; --gridline: rgb(255 255 255 / 0.05); --cell-max: 0.32;
    --line: #43444a; --line-soft: #323338; --muted: #9b9ca4; --soft: #b5b6bd; --label: #cecfd5; --hover: #26272b;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 16px 40px -12px rgb(0 0 0 / .6);
    --red-50: #2c1517; --red-600: #e5484d; --red-800: #ffabae; --amber-700: #ffc95e;
    --green-50: #10251c; --green-600: #2fb47a; --green-800: #8eebc0;
    --brand-50: color-mix(in oklab, var(--brand-600) 14%, #1a1b1e);
    --brand-700: color-mix(in oklab, var(--brand-600) 62%, white);
  }
  :root[dir='rtl'] { --font-sans: 'IBM Plex Sans Arabic', 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; transition: background-color .3s; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand-600); outline-offset: 2px; }

  /* Mockup controls (not part of the design) */
  .mock-bar { position: relative; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 16px; background: var(--snow); border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
  .mock-bar b { font-family: var(--font-mono); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; color: var(--soft); }
  .mock-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); background: var(--snow); }
  .seg button { border: 0; background: none; padding: 5px 10px; cursor: pointer; color: var(--soft); font-size: 12px; }
  .seg button[aria-pressed='true'] { background: var(--ink); color: var(--canvas); }
  .swatch { width: 22px; height: 22px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
  .swatch[aria-pressed='true'] { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Page */
  .page { position: relative; min-height: calc(100% - 46px); display: flex; flex-direction: column; overflow: hidden; }
  #grid-art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .top, .stage, .foot { position: relative; z-index: 1; }

  .top { display: flex; justify-content: flex-end; gap: 8px; padding: 16px; }
  .ctl { height: 36px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--snow); padding: 0 10px; font-size: 14px; cursor: pointer; }
  .ctl:hover { border-color: var(--muted); }

  /* Language menu */
  .lang { position: relative; }
  .flag { width: 20px; height: 14px; flex: none; display: block; box-shadow: 0 0 0 1px rgb(0 0 0 / .12); }
  .chev { color: var(--muted); transition: transform .15s; }
  .lang[data-open='true'] .chev { transform: rotate(180deg); }
  .menu { position: absolute; inset-inline-end: 0; top: calc(100% + 4px); min-width: 230px; white-space: nowrap; margin: 0; padding: 4px 0; list-style: none; background: var(--snow); border: 1px solid var(--line); box-shadow: var(--shadow); z-index: 5; }
  .menu li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  .menu li:hover, .menu li.active { background: var(--hover); }
  .menu li[aria-selected='true'] { font-weight: 600; }
  .menu .tick { margin-inline-start: auto; color: var(--brand-700); visibility: hidden; }
  .menu li[aria-selected='true'] .tick { visibility: visible; }
  .draft { font-size: 10px; font-family: var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--amber-700); }

  /* Theme toggle: shows the mode you can switch to; icons cross-fade with a quarter turn. */
  .mode { width: 36px; padding: 0; justify-content: center; position: relative; }
  .mode svg { position: absolute; transition: opacity .35s ease, transform .45s ease; }
  .mode .sun { opacity: 0; transform: rotate(-90deg) scale(.6); }
  .mode .moon { opacity: 1; transform: none; }
  .mode[data-current='dark'] .sun { opacity: 1; transform: none; }
  .mode[data-current='dark'] .moon { opacity: 0; transform: rotate(90deg) scale(.6); }

  .stage { flex: 1; display: flex; justify-content: center; align-items: center; padding: 8px 16px 32px; }
  .card { width: 100%; max-width: 420px; background: var(--snow); border: 1px solid var(--line-soft); box-shadow: var(--shadow); padding: 40px 36px 36px; transition: background-color .3s, border-color .3s; }
  @media (max-width: 480px) { .card { padding: 32px 22px 28px; } }

  .org { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; font-weight: 600; letter-spacing: -0.01em; }
  .mark rect { fill: var(--brand-600); }
  .mark path { fill: var(--brand-contrast); }

  .step-icon { width: 44px; height: 44px; display: grid; place-items: center; margin-bottom: 20px; background: var(--brand-50); color: var(--brand-700); }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
  .sub { margin: 6px 0 28px; color: var(--soft); }
  .stack { display: grid; gap: 20px; }

  label.lbl { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--label); }
  .field { position: relative; }
  .input { width: 100%; height: 44px; border: 1px solid var(--line); background: var(--snow); padding: 0 12px; font-size: 15px; border-radius: 0; transition: border-color .15s; }
  .input:hover { border-color: var(--muted); }
  .input:focus { outline: 2px solid var(--brand-600); outline-offset: -2px; border-color: var(--brand-600); }
  .input[aria-invalid='true'] { border-color: var(--red-600); }
  .input.pw { padding-inline-end: 44px; }
  .eye { position: absolute; inset-inline-end: 0; top: 0; width: 44px; height: 44px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .eye:hover { color: var(--ink); }
  .note { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .note.warn { color: var(--amber-700); }
  .code { height: 56px; text-align: center; font-family: var(--font-mono); font-size: 24px; letter-spacing: .5em; padding-left: .5em; font-variant-numeric: tabular-nums; }

  .row-end { display: flex; justify-content: flex-end; margin-top: 8px; }
  .link { border: 0; background: none; padding: 0; color: var(--brand-700); font-size: 14px; font-weight: 500; cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--label); cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--brand-600); margin: 0; }

  .submit { display: inline-flex; width: 100%; height: 44px; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--brand-600); color: var(--brand-contrast); font-size: 15px; font-weight: 500; cursor: pointer; transition: background .15s; }
  .submit:hover { background: var(--brand-700); }
  .submit:disabled { opacity: .6; cursor: not-allowed; }
  .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner { display: flex; gap: 10px; padding: 12px 14px; font-size: 14px; border-inline-start: 4px solid; }
  .banner svg { flex: none; margin-top: 2px; }
  .banner.err { border-color: var(--red-600); background: var(--red-50); color: var(--red-800); }
  .banner.ok { border-color: var(--brand-600); background: var(--brand-50); color: var(--brand-700); }

  .divider { margin: 28px 0 0; padding-top: 20px; border-top: 1px solid var(--line-soft); font-size: 14px; color: var(--soft); }
  .back { display: inline-flex; align-items: center; gap: 6px; margin-top: 24px; }
  [dir='rtl'] .back svg { transform: scaleX(-1); }

  .foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; padding: 16px; font-size: 12px; color: var(--muted); }
  .foot a { color: inherit; text-decoration: none; }
  .foot a:hover { color: var(--ink); }
  .powered { display: inline-flex; align-items: center; gap: 6px; }

  @media (prefers-reduced-motion: reduce) { .mode svg, body, .card { transition: none; } .spin { animation-duration: 2s; } }
</style>

<div class="mock-bar" role="toolbar" aria-label="Mockup controls">
  <div class="mock-group"><b>State</b>
    <div class="seg" id="state-seg">
      <button type="button" data-state="signIn" aria-pressed="true">Sign in</button>
      <button type="button" data-state="error" aria-pressed="false">Wrong password</button>
      <button type="button" data-state="mfa" aria-pressed="false">Two-step</button>
      <button type="button" data-state="forgot" aria-pressed="false">Forgot</button>
      <button type="button" data-state="sent" aria-pressed="false">Link sent</button>
    </div>
  </div>
  <div class="mock-group"><b>Tenant</b>
    <button type="button" class="swatch" data-org="grids" style="background:#0f62fe" title="Grids (no tenant)" aria-label="Grids, no tenant branding" aria-pressed="true"></button>
    <button type="button" class="swatch" data-org="river" style="background:#00796b" title="Riverbend Water (example)" aria-label="Riverbend Water, example tenant" aria-pressed="false"></button>
    <button type="button" class="swatch" data-org="health" style="background:#b4235a" title="Kestrel Health (example)" aria-label="Kestrel Health, example tenant" aria-pressed="false"></button>
  </div>
</div>

<div class="page">
  <canvas id="grid-art" aria-hidden="true"></canvas>

  <header class="top">
    <div class="lang" id="lang" data-open="false">
      <button type="button" class="ctl" id="lang-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
        <span id="lang-flag"></span><span id="lang-name">English</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <ul class="menu" id="lang-menu" role="listbox" aria-label="Language" hidden></ul>
    </div>
    <button type="button" class="ctl mode" id="mode" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="stage">
    <div class="card">
      <div class="org"><span id="mark"></span><span id="org-name">Grids</span></div>
      <div id="card"></div>
    </div>
  </main>

  <footer class="foot">
    <span id="copyright">© 2026 Grids</span>
    <span class="powered" id="powered" hidden><span id="mark-small"></span>Powered by Grids</span>
    <a href="#">Privacy</a><a href="#">Terms</a>
  </footer>
</div>

<script>
  // Simplified 20×14 flags. Arabic spans many countries, so it gets a script tile instead of one nation's flag.
  const FLAGS = {
    en: '<rect width="20" height="14" fill="#012169"/><path d="M0 0l20 14M20 0L0 14" stroke="#fff" stroke-width="2.8"/><path d="M0 0l20 14M20 0L0 14" stroke="#C8102E" stroke-width="1"/><path d="M10 0v14M0 7h20" stroke="#fff" stroke-width="4.6"/><path d="M10 0v14M0 7h20" stroke="#C8102E" stroke-width="2.6"/>',
    fr: '<rect width="20" height="14" fill="#fff"/><rect width="6.67" height="14" fill="#002395"/><rect x="13.33" width="6.67" height="14" fill="#ED2939"/>',
    es: '<rect width="20" height="14" fill="#AA151B"/><rect y="3.5" width="20" height="7" fill="#F1BF00"/>',
    ar: '<rect width="20" height="14" fill="#3f3f46"/><text x="10" y="11" text-anchor="middle" font-size="10" font-family="IBM Plex Sans Arabic, sans-serif" fill="#fff">ع</text>',
    sm: '<rect width="20" height="14" fill="#CE1126"/><rect width="10" height="7" fill="#002B7F"/><g fill="#fff"><circle cx="5" cy="1.8" r=".7"/><circle cx="3.2" cy="3.6" r=".7"/><circle cx="6.8" cy="3.4" r=".7"/><circle cx="5" cy="5.4" r=".8"/><circle cx="6" cy="4.4" r=".4"/></g>',
    to: '<rect width="20" height="14" fill="#C10000"/><rect width="9" height="7" fill="#fff"/><path d="M4.5 1.2v4.6M2.2 3.5h4.6" stroke="#C10000" stroke-width="1.6"/>',
    bi: '<rect width="20" height="7" fill="#D21034"/><rect y="7" width="20" height="7" fill="#009543"/><path d="M0 5.6h20v2.8H0z" fill="#FDCE12"/><path d="M0 0L11 7 0 14z" fill="#FDCE12"/><path d="M0 1.2L9.2 7 0 12.8z" fill="#000"/><path d="M0 6.2h20v1.6H0z" fill="#000"/>',
    tpi: '<path d="M0 0h20L0 14z" fill="#000"/><path d="M20 0v14H0z" fill="#CE1126"/><g fill="#fff"><circle cx="3" cy="5.5" r=".6"/><circle cx="5" cy="3.5" r=".6"/><circle cx="5.2" cy="7" r=".6"/><circle cx="7" cy="5" r=".6"/><circle cx="4.2" cy="9" r=".4"/></g><path d="M12.5 5c2-1.4 4.2-1 5 .2-1.6-.2-2.6.4-3.2 1.6.8.4 1.6 1.4 1.4 3-1-1.4-2.6-1.8-3.6-1.2.2-1.2 0-2.4.4-3.6z" fill="#FCD116"/>',
  };
  const LANGS = [
    { code: 'en', name: 'English' },
    { code: 'fr', name: 'Français' },
    { code: 'es', name: 'Español' },
    { code: 'ar', name: 'العربية', rtl: true },
    { code: 'sm', name: 'Gagana Sāmoa', draft: true },
    { code: 'to', name: 'Lea faka-Tonga', draft: true },
    { code: 'bi', name: 'Bislama', draft: true },
    { code: 'tpi', name: 'Tok Pisin', draft: true },
  ];
  const flag = (code) => `<svg class="flag" viewBox="0 0 20 14" aria-hidden="true">${FLAGS[code]}</svg>`;

  const ORGS = {
    grids: { name: 'Grids', color: '#0f62fe', tenant: false, register: false },
    river: { name: 'Riverbend Water', color: '#00796b', tenant: true, register: false },
    health: { name: 'Kestrel Health', color: '#b4235a', tenant: true, register: true },
  };
  const markSvg = (size) =>
    `<svg class="mark" width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true" style="display:block"><rect width="32" height="32"/><path d="M9 9h6v6H9zM17 9h6v6h-6zM9 17h6v6H9zM17 17h6v6h-6z"/></svg>`;
  const ICON = {
    alert: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
    eye: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.4 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/></svg>',
    shield: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
    mail: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16"/><path d="m2 6 10 7 10-7"/></svg>',
    back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  };

  let org = 'grids';
  let state = 'signIn';
  const form = { email: 'amina.rahman@example.org', password: '', remember: true };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  function signIn(error) {
    const o = ORGS[org];
    return `
      <form id="f" novalidate>
        <h1>Sign in</h1>
        <p class="sub">to continue to ${esc(o.name)}</p>
        <div class="stack">
          ${error ? `<div class="banner err" role="alert">${ICON.alert}<span>Incorrect email or password.</span></div>` : ''}
          <div>
            <label class="lbl" for="email">Email</label>
            <input class="input" id="email" type="email" autocomplete="username" dir="ltr" value="${esc(form.email)}" ${error ? 'aria-invalid="true"' : ''} />
          </div>
          <div>
            <label class="lbl" for="password">Password</label>
            <div class="field">
              <input class="input pw" id="password" type="password" autocomplete="current-password" value="${esc(form.password)}" ${error ? 'aria-invalid="true"' : ''} />
              <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">${ICON.eye}</button>
            </div>
            <div class="note warn" id="caps" hidden>Caps Lock is on</div>
            <div class="row-end"><button type="button" class="link" data-go="forgot">Forgot password?</button></div>
          </div>
          <label class="check"><input type="checkbox" id="remember" ${form.remember ? 'checked' : ''} /> Keep me signed in</label>
          <button class="submit" id="submit" type="submit">Sign in</button>
        </div>
        ${o.register ? `<p class="divider">New to ${esc(o.name)}? <button type="button" class="link">Create an account</button></p>` : ''}
      </form>`;
  }

  const VIEWS = {
    signIn: () => signIn(false),
    error: () => signIn(true),
    mfa: () => `
      <form id="f" novalidate>
        <div class="step-icon">${ICON.shield}</div>
        <h1>Two-step verification</h1>
        <p class="sub">Enter the 6-digit code from your authenticator app.</p>
        <div class="stack">
          <div>
            <label class="lbl" for="code">Authentication code</label>
            <input class="input code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" dir="ltr" />
          </div>
          <button class="submit" id="submit" type="submit">Verify</button>
          <button type="button" class="link" style="justify-self:start">Use a recovery code instead</button>
        </div>
        <button type="button" class="link back" data-go="signIn">${ICON.back} Back to sign in</button>
      </form>`,
    forgot: () => `
      <form id="f" novalidate>
        <div class="step-icon">${ICON.mail}</div>
        <h1>Reset your password</h1>
        <p class="sub">Enter your email address and we’ll send you a link to choose a new password.</p>
        <div class="stack">
          <div>
            <label class="lbl" for="email">Email</label>
            <input class="input" id="email" type="email" dir="ltr" value="${esc(form.email)}" />
          </div>
          <button class="submit" id="submit" type="submit">Send reset link</button>
        </div>
        <button type="button" class="link back" data-go="signIn">${ICON.back} Back to sign in</button>
      </form>`,
    sent: () => `
      <div class="step-icon">${ICON.mail}</div>
      <h1>Check your inbox</h1>
      <p class="sub">Reset your password</p>
      <div class="banner ok" role="status">${ICON.check}<span>If an account exists for ${esc(form.email)}, a reset link is on its way.</span></div>
      <button type="button" class="link back" data-go="signIn">${ICON.back} Back to sign in</button>`,
  };

  const card = document.getElementById('card');
  function render() {
    card.innerHTML = VIEWS[state]();
    document.querySelectorAll('#state-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === state)));
    wire();
  }
  function setState(s) { state = s; render(); }

  function wire() {
    card.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => setState(b.dataset.go)));
    const email = card.querySelector('#email');
    if (email) email.addEventListener('input', (e) => (form.email = e.target.value));
    const pw = card.querySelector('#password');
    if (pw) {
      pw.addEventListener('input', (e) => (form.password = e.target.value));
      const caps = card.querySelector('#caps');
      const onKey = (e) => (caps.hidden = !(e.getModifierState && e.getModifierState('CapsLock')));
      pw.addEventListener('keydown', onKey);
      pw.addEventListener('keyup', onKey);
      const eye = card.querySelector('#eye');
      eye.addEventListener('click', () => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        eye.innerHTML = show ? ICON.eyeOff : ICON.eye;
        eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        eye.setAttribute('aria-pressed', String(show));
      });
    }
    const remember = card.querySelector('#remember');
    if (remember) remember.addEventListener('change', (e) => (form.remember = e.target.checked));
    const code = card.querySelector('#code');
    if (code) code.addEventListener('input', (e) => (e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6)));
    const f = card.querySelector('#f');
    if (f) f.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = card.querySelector('#submit');
      const label = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${label}`;
      setTimeout(() => {
        // Demo flow: blank password → error; otherwise on to the next step.
        if (state === 'signIn' || state === 'error') setState(form.password ? 'mfa' : 'error');
        else if (state === 'forgot') setState('sent');
        else { btn.disabled = false; btn.textContent = label; }
      }, 700);
    });
  }

  function applyOrg(key) {
    org = key;
    const o = ORGS[key];
    document.documentElement.style.setProperty('--brand-600', o.color);
    document.getElementById('org-name').textContent = o.name;
    document.getElementById('mark').innerHTML = markSvg(30);
    document.getElementById('mark-small').innerHTML = markSvg(14);
    document.getElementById('powered').hidden = !o.tenant;
    document.getElementById('copyright').textContent = `© 2026 ${o.tenant ? o.name : 'Grids'}`;
    document.querySelectorAll('.swatch').forEach((s) => s.setAttribute('aria-pressed', String(s.dataset.org === key)));
    brandColor = o.color;
    render();
  }

  /* Theme: follows the system until the person picks; the button always offers the other mode. */
  const modeBtn = document.getElementById('mode');
  const sysDark = matchMedia('(prefers-color-scheme: dark)');
  const current = () => document.documentElement.dataset.theme || (sysDark.matches ? 'dark' : 'light');
  function syncMode() {
    const cur = current();
    const next = cur === 'dark' ? 'light' : 'dark';
    modeBtn.dataset.current = cur;
    modeBtn.setAttribute('aria-label', `Switch to ${next} mode`);
    modeBtn.title = `Switch to ${next} mode`;
  }
  modeBtn.addEventListener('click', () => {
    const next = current() === 'dark' ? 'light' : 'dark';
    // Picking the system's own mode clears the override, so it keeps following the system.
    if ((next === 'dark') === sysDark.matches) delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = next;
    syncMode();
  });
  sysDark.addEventListener('change', syncMode);
  syncMode();

  /* Language menu with flags */
  const lang = document.getElementById('lang');
  const langBtn = document.getElementById('lang-btn');
  const menu = document.getElementById('lang-menu');
  let langCode = 'en';
  function renderLangs() {
    const cur = LANGS.find((l) => l.code === langCode);
    document.getElementById('lang-flag').innerHTML = flag(cur.code);
    document.getElementById('lang-name').textContent = cur.name;
    menu.innerHTML = LANGS.map((l) => `<li role="option" id="opt-${l.code}" data-code="${l.code}" aria-selected="${l.code === langCode}" lang="${l.code}">${flag(l.code)}<span>${l.name}</span>${l.draft ? '<span class="draft">Draft</span>' : ''}<svg class="tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></li>`).join('');
  }
  function openMenu(open) {
    lang.dataset.open = String(open);
    langBtn.setAttribute('aria-expanded', String(open));
    menu.hidden = !open;
  }
  langBtn.addEventListener('click', () => openMenu(menu.hidden));
  menu.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li) return;
    langCode = li.dataset.code;
    const l = LANGS.find((x) => x.code === langCode);
    // The mockup only flips direction; copy stays in English.
    document.documentElement.dir = l.rtl ? 'rtl' : 'ltr';
    renderLangs();
    openMenu(false);
    langBtn.focus();
  });
  document.addEventListener('click', (e) => { if (!lang.contains(e.target)) openMenu(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) { openMenu(false); langBtn.focus(); } });
  renderLangs();

  document.querySelectorAll('#state-seg button').forEach((b) => b.addEventListener('click', () => setState(b.dataset.state)));
  document.querySelectorAll('.swatch').forEach((s) => s.addEventListener('click', () => applyOrg(s.dataset.org)));

  /* Background grid: each lit cell fades in, holds, fades out, then a new random cell takes its place. */
  const canvas = document.getElementById('grid-art');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SIZE = 44;
  let brandColor = '#0f62fe';
  let cols = 0, rows = 0, lit = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  function spawn(now, stagger) {
    return { c: Math.floor(Math.random() * cols), r: Math.floor(Math.random() * rows), t0: now + (stagger ? rand(-6000, 4000) : rand(0, 2500)), dur: rand(4000, 8000), peak: rand(0.35, 1) };
  }
  function resize(now) {
    const r = canvas.getBoundingClientRect();
    const dpr = devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    cols = Math.ceil(r.width / SIZE) + 1;
    rows = Math.ceil(r.height / SIZE) + 1;
    const count = Math.round(cols * rows * 0.07);
    lit = Array.from({ length: count }, () => spawn(now, true));
  }
  function draw(now) {
    const dpr = devicePixelRatio || 1;
    const ctx = canvas.getContext('2d');
    const css = getComputedStyle(document.documentElement);
    const s = SIZE * dpr;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = css.getPropertyValue('--gridline').trim();
    ctx.lineWidth = dpr;
    ctx.beginPath();
    for (let c = 0; c <= cols; c++) { ctx.moveTo(c * s + .5, 0); ctx.lineTo(c * s + .5, canvas.height); }
    for (let r = 0; r <= rows; r++) { ctx.moveTo(0, r * s + .5); ctx.lineTo(canvas.width, r * s + .5); }
    ctx.stroke();
    const max = parseFloat(css.getPropertyValue('--cell-max')) || 0.22;
    ctx.fillStyle = brandColor;
    for (let i = 0; i < lit.length; i++) {
      const L = lit[i];
      let p = (now - L.t0) / L.dur;
      if (reduce) p = 0.5;
      if (p >= 1) { lit[i] = spawn(now, false); continue; }
      if (p <= 0) continue;
      ctx.globalAlpha = Math.sin(p * Math.PI) ** 2 * L.peak * max;
      ctx.fillRect(L.c * s + 2 * dpr, L.r * s + 2 * dpr, s - 3 * dpr, s - 3 * dpr);
    }
    ctx.globalAlpha = 1;
  }
  function loop(now) { draw(now); requestAnimationFrame(loop); }
  resize(performance.now());
  addEventListener('resize', () => { resize(performance.now()); draw(performance.now()); });

  applyOrg('grids');
  if (reduce) { draw(performance.now()); new MutationObserver(() => draw(performance.now())).observe(document.documentElement, { attributes: true }); }
  else requestAnimationFrame(loop);
</script>
